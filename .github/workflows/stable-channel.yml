name: Update stable release channel

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release-feed
  cancel-in-progress: false

jobs:
  index:
    if: >-
      github.repository == 'TacitusVox/K-UI-NeXT' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && !github.event.release.prerelease))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - name: Publish the verified stable update feed
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 tools/fetch_deps.py --fatfs-only
          python3 tests/test_update_channels.py
          python3 tools/publish_stable_feed.py
