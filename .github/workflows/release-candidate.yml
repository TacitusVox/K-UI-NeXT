name: K-UI release candidate

on:
  push:
    branches: [main, codex/3-0-rc1-full-nightlies]
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate tag matching the checked-in GUI version
        required: true
        type: string
      draft:
        description: Leave the verified prerelease in draft
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: kui-release-candidate
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'TacitusVox/K-UI-NeXT' &&
      ((github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release candidate: v'))) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/codex/3-0-rc1-full-nightlies' &&
        startsWith(github.event.head_commit.message, 'Draft release candidate: v3.0.0-rc.1')))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      draft: ${{ steps.candidate.outputs.draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Match the promotion request to the GUI version
        id: candidate
        env:
          REQUESTED: ${{ inputs.tag }}
          REQUEST_DRAFT: ${{ inputs.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          sys.path.insert(0, 'tools')
          from channel_feed import remote_ref
          from release_candidate import REVIEW_REF, REVIEW_TAG, acceptance, candidate, request_matches, view
          metadata, head, kup, sd = candidate()
          tag = "v" + metadata["version"]
          review = os.environ["GITHUB_REF"] == REVIEW_REF
          draft = review or os.environ["REQUEST_DRAFT"] == "true"
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              matches = os.environ["REQUESTED"] == tag
          else:
              with open(os.environ["GITHUB_EVENT_PATH"]) as src:
                  message = json.load(src)["head_commit"]["message"]
              matches = request_matches(message, tag, review) and (not review or tag == REVIEW_TAG)
          if not matches:
              raise SystemExit("Candidate request and checked-in release version differ")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              approved = None if review else acceptance(tag, head, kup, sd)
              print("accepted=" + (approved["revision"] if approved else ""), file=out)
              if approved:
                  # Published retries remain verifiable after the staging artifact expires.
                  # A read-only job does not need to discover an unpublished draft.
                  existing = view(tag) if remote_ref("refs/tags/" + tag) else None
                  public = existing and not existing["isDraft"]
                  print("published=" + str(bool(public)).lower(), file=out)
                  print("accepted_run=" + str(approved["workflow_run_id"]), file=out)
                  print("accepted_artifact=" + str(approved["artifact_id"]), file=out)
              print("tag=" + tag, file=out)
              print("draft=" + str(draft).lower(), file=out)
          PYTHON
      - name: Install Dreamcast build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget patch python3 python3-pil bison flex texinfo gettext \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libpng-dev libjpeg-dev dosfstools exfatprogs mtools
      - name: Restore pinned compiler and downloads
        if: steps.candidate.outputs.accepted == ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/sh-elf
            .deps/kos/utils/kos-chain/*.tar.*
          key: sh-elf-ubuntu24-v1-${{ hashFiles('dependencies.json', 'tools/setup_kos.sh') }}
      - name: Validate packaging and publication
        run: |
          python3 tools/check_gui_lines.py
          python3 tools/fetch_deps.py --fatfs-only
          python3 tests/test_software_distribution.py
          python3 tests/test_release_candidate_publication.py
      - name: Build a new candidate
        if: steps.candidate.outputs.accepted == ''
        run: |
          bash tools/setup_kos.sh
          bash tools/build_distribution_gui.sh --candidate
          python3 tools/release_candidate.py build "$RUNNER_TEMP/candidate"
      - name: Download the exact accepted build
        if: steps.candidate.outputs.accepted && steps.candidate.outputs.published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.accepted_run }}
          artifact-ids: ${{ steps.candidate.outputs.accepted_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Download an already-published candidate for verification
        if: steps.candidate.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          gh release download "$TAG" --dir "$RUNNER_TEMP/candidate"
      - name: Verify accepted hashes and full software inventory
        if: steps.candidate.outputs.accepted
        run: python3 tools/release_candidate.py verify-accepted "$RUNNER_TEMP/candidate"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Verify and publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.build.outputs.tag }}
          LEAVE_DRAFT: ${{ needs.build.outputs.draft }}
        run: |
          python3 tools/fetch_deps.py --fatfs-only
          flags=()
          if [[ "$LEAVE_DRAFT" == "true" ]]; then flags+=(--draft); fi
          python3 tools/release_candidate.py publish "$RUNNER_TEMP/candidate" --tag "$CANDIDATE_TAG" "${flags[@]}"

  update-post:
    if: >-
      github.repository == 'TacitusVox/K-UI-NeXT' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release post: v3.0.0-rc.1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update the published RC1 artwork and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.0.0-rc.1
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases"
          id=$(gh api "$endpoint/tags/$TAG" --jq 'select(.draft == false and .prerelease == true) | .id')
          test -n "$id"
          gh api --method PATCH "$endpoint/$id" -f 'name=K-UI 3.0 RC1 “Muramasa”' \
            -F body=@docs/release-v3.0.0-notes.md --silent
